# 默认：H2 内存库。切换数据库：
#   PostgreSQL: --spring.profiles.active=postgresql
#   MySQL:      --spring.profiles.active=mysql
spring:
  application:
    name: test-all-model
  datasource:
    url: jdbc:h2:mem:testall;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  # Redis 默认连本机 6379（与 brew install redis 一致）
  # - 本地显式 profile: redis-local → application-redis-local.yml
  # - 云实例 profile: redis-cloud → application-redis-cloud.yml（需 REDIS_PASSWORD）
  # - 探活: GET /api/redis-test/ping
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # username/password 仅 redis-cloud profile 配置；本地无密码 Redis 勿设置这两项
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5s

server:
  port: 8080

mybatis-plus:
  db-type: h2
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  type-aliases-package: com.lance.testall.testentity.entity,com.lance.testall.threadpool.entity,com.lance.testall.lock.entity

# 并发锁实验（见 ai_docs/lock/26052602-*.md）
lock:
  demo:
    default-sku-id: SKU-DEMO-001
    thread-pool:
      core-pool-size: 50
      max-pool-size: 50
      queue-capacity: 500
      thread-name-prefix: lock-demo-
    try-lock-timeout-ms: 100
    semaphore-permits: 10
    optimistic-max-retries: 5
  # 实验 6：Redis 分布式锁（见 ai_docs/lock/26052604-*.md）
  redis:
    enabled: true
    key-prefix: "lock:stock:"
    wait-seconds: 3
    lease-seconds: 300

# JDK 线程池实验（见 ai_docs/thread/26052502-*.md）
# 实验 3 触发拒绝：可启用 profile exp3-reject（queue=5, max=2）
thread-pool:
  demo:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 10
    keep-alive-seconds: 60
    thread-name-prefix: tp-demo-
    rejection-policy: abort
    await-termination-seconds: 30
  spring-demo:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 10
    keep-alive-seconds: 60
    thread-name-prefix: tp-spring-
    rejection-policy: abort
    await-termination-seconds: 30
    wait-for-tasks-to-complete-on-shutdown: true

# 启动时 Mapper 探活：表由 schema.sql 初始化后再检查；本地 H2 可关闭避免时序告警
mybatis:
  boot:
    check:
      enable: false
      block: false

logging:
  level:
    com.lance.testall: INFO

redis:
  test:
    key-prefix: "testall:redis-test:"
